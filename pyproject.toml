[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.0.0"
description = "Local-first coding agent with a LangGraph state machine and Ollama-backed LLM calls."
readme = "README.md"
requires-python = ">=3.11.2"
license = { text = "Proprietary" }
authors = [{ name = "Local-first coding agent" }]
keywords = ["coding-agent", "langgraph", "ollama", "textual", "serena", "mcp"]
dependencies = [
  "langgraph==1.2.16",
  "langgraph-checkpoint-postgres==3.2.0",
  "langchain-core==1.6.13",
  "langchain==1.4.7",
  "langchain-ollama==1.1.0",
  "langchain-mcp-adapters==0.3.2",
  "pydantic==2.11.7",
  "pydantic-settings==2.16.1",
  "platformdirs==4.3.7",
  "keyring==25.6.0",
  "typer==0.27.3",
  "rich==15.0.0",
  "textual==8.2.8",
  "psutil==7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.1.1",
  "pytest-textual-snapshot==1.1.0",
  "ruff==0.13.2",
  "mypy==2.4.0",
  "pre-commit==4.2.0",
]

[project.scripts]
agent = "agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as calls in parameter defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
packages = ["agent"]
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls the real Ollama server; skipped unless AGENT_LIVE=1"]
